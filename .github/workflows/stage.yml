# Mediul stage "la cerere" (ca workflow-ul create/destroy din Genesis):
#   - manual: Actions -> Stage environment -> Run workflow -> create / destroy
#   - automat: destroy in fiecare seara, ca un stack uitat pornit sa nu consume creditul
name: Stage environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Ce facem cu stage-app
        type: choice
        options: [create, destroy]
        required: true
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 23:00 ora Romaniei (vara)

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "121835991412"
  TF_VERSION: 1.16.4
  # La rularea programata nu exista input -> destroy
  ACTION: ${{ github.event_name == 'schedule' && 'destroy' || inputs.action }}

jobs:
  terraform:
    name: ${{ github.event_name == 'schedule' && 'destroy (scheduled)' || inputs.action }}
    runs-on: ubuntu-24.04
    environment:
      name: stage
      url: ${{ steps.smoke.outputs.app_url }}
    concurrency:
      group: stage-app
      cancel-in-progress: false
    timeout-minutes: 45 # CloudFront se sterge in ~5-10 min
    defaults:
      run:
        working-directory: terraform/stage-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/wfm-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: Current state
        id: state
        run: |
          count=$(terraform state list | wc -l)
          echo "resources=$count" >> "$GITHUB_OUTPUT"
          echo "stage-app inainte: $count resurse; actiune: $ACTION" >> "$GITHUB_STEP_SUMMARY"

      # ---------- create ----------
      - name: terraform plan
        if: env.ACTION == 'create'
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        if: env.ACTION == 'create'
        run: terraform apply -input=false tfplan

      - name: Wait for services
        if: env.ACTION == 'create'
        run: |
          aws ecs wait services-stable --cluster wfm-stage \
            --services mosquitto influxdb worker sensor backend grafana

      - name: Smoke test
        id: smoke
        if: env.ACTION == 'create'
        run: |
          url=$(terraform output -raw app_url)
          echo "app_url=$url" >> "$GITHUB_OUTPUT"
          # CloudFront poate raspunde cu 5xx cateva minute dupa creare
          curl -fsS --retry 20 --retry-delay 15 --retry-all-errors "$url/health"
          echo
          curl -fsS -o /dev/null -w "grafana: %{http_code}\n" "$url/grafana/login"
          echo "Aplicatia: $url (image tag: $(aws ssm get-parameter --name /wfm/stage/image_tag --query Parameter.Value --output text))" >> "$GITHUB_STEP_SUMMARY"

      # ---------- destroy ----------
      - name: terraform destroy
        if: env.ACTION == 'destroy' && steps.state.outputs.resources != '0'
        run: terraform destroy -input=false -auto-approve

      - name: Verify destroy
        if: env.ACTION == 'destroy'
        run: |
          left=$(terraform state list | wc -l)
          echo "stage-app dupa destroy: $left resurse" >> "$GITHUB_STEP_SUMMARY"
          [ "$left" -eq 0 ]
