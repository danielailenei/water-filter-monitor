# Verificari la fiecare pull request spre main - fara credentiale AWS.
# (PR-urile din fork-uri nu primesc oricum token OIDC; aici nu avem nevoie de el.)
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nou in acelasi PR anuleaza rularea veche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.4

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      # -backend=false: doar sintaxa si referintele, fara acces la state-ul din S3
      - name: terraform validate
        run: |
          for dir in bootstrap shared stage-base stage-app; do
            echo "::group::$dir"
            terraform -chdir="terraform/$dir" init -backend=false -input=false
            terraform -chdir="terraform/$dir" validate
            echo "::endgroup::"
          done

  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11" # aceeasi versiune ca imaginile Docker

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r sensor/requirements.txt

      - name: Byte-compile
        run: python -m compileall -q backend sensor scripts

      - name: Dependency conflicts
        run: pip check

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-24.04-arm # runner ARM64 nativ: aceeasi arhitectura ca Fargate Graviton
    strategy:
      fail-fast: false
      matrix:
        service: [backend, sensor, mosquitto, grafana]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Doar build (push: false) - verifica ca Dockerfile-ul inca merge
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
