# Local development stack. The same images (built from these folders) run on
# AWS ECS Fargate - see terraform/stage-app. Only the addresses differ: compose
# service names here, *.wfm.local (Cloud Map) and CloudFront on AWS.
services:
  mosquitto:
    # Official image + config baked in (mosquitto/Dockerfile), as on ECS
    build: ./mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # ${...} come from a local .env file (git-ignored, see .env.example).
      # The defaults below are for local development only.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD:-changeme123}
      - DOCKER_INFLUXDB_INIT_ORG=disertatie
      - DOCKER_INFLUXDB_INIT_BUCKET=water_filter
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-changeme}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=home/water/filter
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN:-changeme}
      - INFLUX_ORG=disertatie
      - INFLUX_BUCKET=water_filter
      - CLOG_THRESHOLD_BAR=1.5
      # Links shown on the dashboard and put in the email/push alerts
      - APP_URL=http://localhost:8000
      - GRAFANA_URL=http://localhost:3000
    env_file:
      - path: .env.secrets
        required: false
    ports:
      - "8000:8000"

  # Same code as `python sensor/virtual_sensor.py`; MQTT_BROKER points at the
  # broker's compose service name.
  sensor:
    build: ./sensor
    container_name: sensor
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=home/water/filter

  grafana:
    # Pinned version + datasource/dashboard baked in (grafana/Dockerfile), as on ECS
    build: ./grafana
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme123}
      # Substituted into provisioning/datasources/influxdb.yaml
      - INFLUX_TOKEN=${INFLUX_TOKEN:-changeme}
      - INFLUX_URL=http://influxdb:8086
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mosquitto-data:
  influxdb-data:
  grafana-data:
