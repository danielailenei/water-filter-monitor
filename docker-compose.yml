services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # ${...} come from a local .env file (git-ignored, see .env.example).
      # The defaults below are for local development only.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD:-changeme123}
      - DOCKER_INFLUXDB_INIT_ORG=disertatie
      - DOCKER_INFLUXDB_INIT_BUCKET=water_filter
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-changeme}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=home/water/filter
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN:-changeme}
      - INFLUX_ORG=disertatie
      - INFLUX_BUCKET=water_filter
      - CLOG_THRESHOLD_BAR=1.5
    env_file:
      - path: .env.secrets
        required: false
    ports:
      - "8000:8000"

  # Same code as `python sensor/virtual_sensor.py`, but MQTT_BROKER points at
  # the broker's compose service name so it runs in the stack with no separate
  # process to babysit on a server.
  sensor:
    build: ./sensor
    container_name: sensor
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=home/water/filter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    # Optional. Left out of the default `up` so the stack fits a 1 GB free-tier
    # VM (the backend already serves its own dashboard on :8000). Include it
    # with:  docker compose --profile grafana up -d
    profiles: ["grafana"]
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme123}
      # lets provisioning/datasources/influxdb.yaml substitute ${INFLUX_TOKEN}
      # instead of hardcoding it
      - INFLUX_TOKEN=${INFLUX_TOKEN:-changeme}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana

volumes:
  influxdb-data:
  grafana-data:
